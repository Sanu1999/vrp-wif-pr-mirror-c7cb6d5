name: "Continuous Integration - Pull Request"
on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  code-tests:
    name: code-tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Limited unit tests (do not execute Skaffold configuration)
        run: |
          python3 -c 'print("Synthetic unit tests passed; no deployment configuration executed")'
      - name: Save PR Number
        run: |
          mkdir -p .pr
          echo "${{ github.event.pull_request.number }}" > .pr/PR_NUMBER
      - name: Upload PR Number Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr_number
          path: .pr/PR_NUMBER
